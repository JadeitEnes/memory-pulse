services:

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: memory_pulse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory_pass}
      POSTGRES_DB: ${POSTGRES_DB:-memory_pulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory_user} -d ${POSTGRES_DB:-memory_pulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memory_net
    restart: unless-stopped

  redis-broker:
    image: redis:7-alpine
    container_name: memory_pulse_redis_broker
    ports:
      - "6379:6379"
    volumes:
      - redis_broker_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - memory_net
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: memory_pulse_redis_cache
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - memory_net
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: memory_pulse_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-memory_user}:${POSTGRES_PASSWORD:-memory_pass}@db:5432/${POSTGRES_DB:-memory_pulse}
      - REDIS_BROKER_URL=redis://redis-broker:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - memory_net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: memory_pulse_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-memory_user}:${POSTGRES_PASSWORD:-memory_pass}@db:5432/${POSTGRES_DB:-memory_pulse}
      - REDIS_BROKER_URL=redis://redis-broker:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - memory_net
    restart: unless-stopped
    command: celery -A app.infrastructure.celery_app worker --loglevel=info -Q prices,scrapers

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: memory_pulse_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-memory_user}:${POSTGRES_PASSWORD:-memory_pass}@db:5432/${POSTGRES_DB:-memory_pulse}
      - REDIS_BROKER_URL=redis://redis-broker:6379/0
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - memory_net
    restart: unless-stopped
    command: celery -A app.infrastructure.celery_app beat --loglevel=info

  frontend:
    image: node:20-alpine
    container_name: memory_pulse_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - api
    networks:
      - memory_net
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"

  nginx:
    image: nginx:1.27-alpine
    container_name: memory_pulse_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - memory_net
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: memory_pulse_flower
    environment:
      - REDIS_BROKER_URL=redis://redis-broker:6379/0
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - memory_net
    restart: unless-stopped
    command: >
      celery -A app.infrastructure.celery_app flower
      --port=5555
      --broker=redis://redis-broker:6379/0

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: memory_pulse_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    networks:
      - memory_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: memory_pulse_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - memory_net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_broker_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  memory_net:
    driver: bridge
