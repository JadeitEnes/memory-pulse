name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements/dev.txt
      - name: Run black
        run: cd backend && black app/ tests/ --check --diff --line-length=100
      - name: Run isort
        run: cd backend && isort app/ tests/ --check-only --profile=black
      - name: Run flake8
        run: cd backend && flake8 app/ --max-line-length=100 --exclude=migrations
      - name: Run mypy
        run: cd backend && mypy app/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        run: cd backend && pip install -r requirements/dev.txt
      - name: Run unit tests
        run: cd backend && pytest tests/unit/ -v
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_BROKER_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6380/0

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          target: development
          tags: memory-pulse-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max